name: Daily SMS

on:
  schedule:
    # Every day at 13:00 UTC (9:00 AM US Eastern during daylight time).
    # Cron here is always UTC.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python send_sms.py --to +13219164708 --message "hello"
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
